version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Qdrant 벡터 DB
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stm32_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # FastAPI 백엔드
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stm32_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=http://172.18.0.1:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-stm32g4_docs}
      - PIN_AF_DB_PATH=/app/agent/pin_af_db.json
      - IOC_OUTPUT_DIR=/tmp/ioc_outputs
      - CODE_OUTPUT_DIR=/tmp/code_outputs
      - no_proxy=localhost,127.0.0.1,qdrant,backend,frontend,172.16.0.0/12
      - NO_PROXY=localhost,127.0.0.1,qdrant,backend,frontend,172.16.0.0/12
    volumes:
      - ioc_outputs:/tmp/ioc_outputs
      - ./agent:/app/agent:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Streamlit 프론트엔드
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: stm32_frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - no_proxy=localhost,127.0.0.1,qdrant,backend,frontend,172.16.0.0/12
      - NO_PROXY=localhost,127.0.0.1,qdrant,backend,frontend,172.16.0.0/12
    volumes:
      - ./agent:/app/agent:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8501' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  qdrant_storage:
    driver: local
  ioc_outputs:
    driver: local
