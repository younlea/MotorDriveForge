version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Qdrant 벡터 DB
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stm32_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # FastAPI 백엔드
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stm32_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # host.docker.internal → 호스트 게이트웨이로 매핑. compose 네트워크 재생성 시
    # 브리지 서브넷/게이트웨이 IP가 바뀌어도 호스트 Ollama(0.0.0.0:11434)에 안정적으로 연결.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-stm32g4_docs}
      - PIN_AF_DB_PATH=/app/agent/pin_af_db.json
      - IOC_OUTPUT_DIR=/tmp/ioc_outputs
      - CODE_OUTPUT_DIR=/tmp/code_outputs
      # 오프라인 운영: bge-m3 임베딩 모델을 huggingface.co가 아닌 마운트된 로컬 캐시에서 로드
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/hf_cache
      - no_proxy=localhost,127.0.0.1,host.docker.internal,qdrant,backend,frontend,172.16.0.0/12
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,qdrant,backend,frontend,172.16.0.0/12
    volumes:
      - ioc_outputs:/tmp/ioc_outputs
      - review_results:/app/review_results
      - ./agent:/app/agent:ro
      # 오프라인 인제스천(RAG 인덱스 빌드)용 — 호스트에 python 없이 컨테이너에서 실행.
      # scripts는 읽기전용, dataset은 chunks_code 생성 위해 쓰기 가능.
      - ./scripts:/app/scripts:ro
      - ./dataset:/app/dataset
      # 호스트의 HF 캐시(오프라인 인제스천 시 받은 bge-m3) → 컨테이너 HF_HOME
      - ${HF_CACHE_DIR:-/root/.cache/huggingface}:/hf_cache:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Streamlit 프론트엔드
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: stm32_frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_URL=http://backend:8000
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - no_proxy=localhost,127.0.0.1,host.docker.internal,qdrant,backend,frontend,172.16.0.0/12
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,qdrant,backend,frontend,172.16.0.0/12
    volumes:
      - ./agent:/app/agent:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8501' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  qdrant_storage:
    driver: local
  ioc_outputs:
    driver: local
  review_results:
    driver: local
